; CoreS3 Walkie-Talkie firmware — PlatformIO project
; See: thoughts/shared/research/2026-06-01-cores3-port-spec.md §7
;       thoughts/shared/plans/2026-06-02-cores3-port-plan.md §P7

[env:m5stack-cores3]
platform = espressif32@6.10.0
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.psram = enabled
board_build.flash_mode = qio
board_build.flash_freq = 80m

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -std=gnu++17

lib_deps =
    m5stack/M5Unified@^0.2.4
    links2004/WebSockets@^2.5.0
    sh123/esp32_opus@^1.0.3
    https://github.com/pschatzmann/arduino-audio-tools.git
    m5stack/M5GFX@^0.2.4
    bblanchon/ArduinoJson@^7.0.0

